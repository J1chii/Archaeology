{% comment %} 
Collection Description card.
{%- endcomment -%}

<div class="card mb-3">
  <div class="card-body">

    <{{ include.heading_level | default: 'h2' | strip }} class="card-title h5">
      Description
    </{{ include.heading_level | default: 'h2' | strip }}>

    <p class="card-text">{{ site.description }}</p>

    {%- assign about = site.data.config-nav | where: "stub","/about.html" | size -%}
    {% if about > 0 %}
    <a class="btn btn-{{ include.btn-color | default: 'primary' }}" href="{{ '/about.html' | relative_url }}">
      Learn More &raquo;
    </a>
    {% endif %}

    <div class="text-start mt-4">
      <button onclick="quote()" class="btn btn-warning">
        Historical Quotes...
      </button>

      <p id="quoteText" class="mt-3"></p>
    </div>

  </div>
</div>
